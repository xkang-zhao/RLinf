# Formal 100-step SpaceUR10e grouped CUDA PPO training configuration.
# Launch: bash examples/embodiment/run_embodiment.sh spaceur10e_warp_ppo_formal_openpi_rlinf
defaults:
  - env/spaceur10e_all_rgb@env.train
  - env/spaceur10e_all_rgb@env.eval
  - model/pi0_spaceur10e_rlinf_ppo@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,rollout: 0
    # One EnvWorker owns all 64 worlds and all eight task scenes on GPU 0.
    env:
      node_group: node
      placement: "0:0"

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: spaceur10e_pi05_warp_ppo_formal
    logger_backends: [tensorboard]
  only_eval: false
  max_epochs: 1000
  max_steps: 100
  # Keep only the final checkpoint for this run.
  save_interval: 100
  seq_length: 4096
  max_prompt_length: 48
  resume_dir: null
  ckpt_path: null
  val_check_interval: -1

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.1
  clip_ratio_low: 0.1
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.98
  reward_coef: 1.0

env:
  group_name: EnvGroup
  train:
    repo_root: /workspace/SpaceRobotEnv
    group_size: 1
    enable_offload: false
    enable_init_offload: false
    reward_coef: ${algorithm.reward_coef}
    task_names: all
    shard_tasks_by_worker: false
    physics_backend: warp
    warp_device: cuda:0
    warp_substeps_per_graph: 10
    deterministic_physics: false
    ik_backend: gpu
    total_num_envs: 64
    # 64 environments x 1 epoch x 420 control steps / 30-step chunks = 896
    # rollout samples, yielding 7 actor global batches per PPO step.
    rollout_epoch: 1
    max_episode_steps: 420
    max_steps_per_rollout_epoch: 420
    auto_reset: false
    ignore_terminations: false
    video_cfg:
      save_video: false
  eval:
    repo_root: /workspace/SpaceRobotEnv
    group_size: 1
    task_names: all
    shard_tasks_by_worker: false
    physics_backend: warp
    warp_device: cuda:0
    warp_substeps_per_graph: 10
    deterministic_physics: false
    ik_backend: gpu
    total_num_envs: 8
    rollout_epoch: 1
    max_episode_steps: 420
    max_steps_per_rollout_epoch: 420
    auto_reset: false
    ignore_terminations: false
    video_cfg:
      save_video: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  seed: 1234
  enable_offload: false
  # LIBERO uses 128/2048 on a larger multi-GPU rollout. For this single A800,
  # 8/128 keeps the same large-batch pattern without exceeding activation RAM.
  # The 896 action chunks form seven global batches per PPO update.
  micro_batch_size: 8
  global_batch_size: 128
  config_name: ${actor.model.openpi.config_name}
  enable_sft_co_train: true
  sft_data_path: /zxk/SpaceRobot/spaceur10e_multitask_lerobot_v21
  sft_batch_size: 2
  sft_num_workers: 0
  sft_loss_weight: 0.1
  sft_co_train_every_micro_batch: false
  model:
    model_path: ${rollout.model.model_path}
    pi05: true
    num_action_chunks: 30
    openpi:
      config_name: pi05_spaceur10e
  optim:
    lr: 5.0e-7
    value_lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 20
  fsdp_config:
    strategy: fsdp
    sharding_strategy: shard_grad_op
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /workspace/RLinf/logs/20260911-06:48:22-spaceur10e_sft_openpi_rlinf_pi05/spaceur10e_pi05_sft/deploy/openpi_rlinf_bf16
    precision: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
