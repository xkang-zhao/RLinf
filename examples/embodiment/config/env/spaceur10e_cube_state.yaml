env_type: spaceur10e
# Names come from my_simulation's eight automatic-grasp tasks. Set task_names:
# all to cycle all eight task definitions across vectorized environments.
task_name: cube

# The adapter also reads SPACEUR10E_REPO_ROOT and resolves all MJCF paths from
# this checkout, so launches do not depend on the current working directory.
repo_root: null
obs_mode: state
obs_format: tensor

seed: 0
total_num_envs: null
group_size: 1

auto_reset: true
ignore_terminations: false
max_steps_per_rollout_epoch: 400
max_episode_steps: 400

# A confirmed grasp receives 1.0; every intermediate/failure step receives 0.0.
use_rel_reward: false
reward_coef: 1.0
is_eval: false

# RLinf policies emit normalized [-1, 1] actions. The adapter scales them to
# tool-frame translation (m), rotation (rad), and gripper command increments.
action_scale: [0.01, 0.01, 0.01, 0.05, 0.05, 0.05, 1.0]

video_cfg:
  save_video: false
  info_on_video: true
  video_base_dir: ${runner.logger.log_path}/video/train
