defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "spaceur10e_pi05_sft"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 9000
  val_check_interval: -1
  save_interval: 3000

data:
  train_data_paths: "/zxk/SpaceRobot/spaceur10e_multitask_lerobot_v21"
  num_workers: 4

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 16
  seed: 0
  model:
    precision: bf16
    model_path: "/zxk/my_openpi/pi05_base_rlinf"
    num_action_chunks: 30
    action_dim: 7
    openpi:
      task: sft
      config_name: "pi05_spaceur10e"
      num_images_in_input: 3
      action_chunk: ${..num_action_chunks}
      action_env_dim: ${..action_dim}
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 48
      discrete_state_input: false
    openpi_data:
      norm_stats_path: ${actor.model.model_path}/spaceur10e/multitask/norm_stats.json
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 500
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: false

critic:
  use_critic_model: false
